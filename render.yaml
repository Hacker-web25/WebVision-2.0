# Free web service on Render. The free plan has no persistent disk, so saved trips and the demo
# inbox reset whenever the service restarts or redeploys — fine for a hackathon demo, not for real use.
#
# Zero secrets needed: mail stays in "outbox" mode and is shown at /<service-url>/dev/outbox.
# To switch to real email later, set MAILER=smtp and SMTP_URL in the Render dashboard and remove
# ALLOW_DEV_OUTBOX.
services:
  - type: web
    name: webvision-2-0
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOW_DEV_OUTBOX
        value: "1"
